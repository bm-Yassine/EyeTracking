session:
  out_dir: "./runs"
  camera_index: 0
  fps: 30
  width: 1280
  height: 720
  record_video: true
  video_codec: "mp4v"     # or "MJPG"
screen:
  width_px: 1920
  height_px: 1080
  grid_rows: 5
  grid_cols: 5
  dwell_ms: 0             # click-based for v1; set >0 for dwell-based advance
camera_model:
  intrinsics_yaml: "./config/intrinsics_charuco.yaml"  # if missing, a rough guess is built
  use_distortion: true
calibration_ui:
  show_next: true
  cross_radius: 14
  cross_thickness: 2
  next_cross_color_bgr: [0, 0, 255]
  curr_cross_color_bgr: [255, 255, 255]
  countdown_total_s: 40      # red total countdown (global)
  per_target_s: 2            # 2 s per cross
  auto_advance: true       # set true to advance automatically every per_target_s
  ring_radius: 40            # red circle radius around current cross
  ring_thickness: 3
  font_scale: 0.9
filters:
  blink_ear_thresh: 0.21
  blink_min_frames: 2
